[project]
name = "syncnode-ai"
version = "0.1.0"
description = "SyncNode AI/ML substrate — model gateway, cognition, RAG, agents"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "httpx>=0.28",
    "anyio>=4.12",
    "tenacity>=9.1",
    # LangGraph / LangChain
    "langgraph>=0.4",
    "langchain-core>=0.3",
    # Token counting
    "tiktoken>=0.12",
    # RAG / Embeddings
    "chromadb>=0.6",
    "sentence-transformers>=3.0",
    # Utilities
    "rich>=14",
    "python-dotenv>=1.0",
    "structlog>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=0.26",
    "pytest-httpx>=0.35",
    "mypy>=1.15",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syncnode_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

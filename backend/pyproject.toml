[project]
name = "syncnode-backend"
version = "0.1.0"
description = "SyncNode backend — FastAPI, LangGraph, tools, verification, audit, SSE"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.22",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.15",
    "aiosqlite>=0.21",
    # asyncpg for future PostgreSQL: "asyncpg>=0.30"
    # Settings / env
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "python-dotenv>=1.0",
    # HTTP client
    "httpx>=0.28",
    "anyio>=4.12",
    "tenacity>=9.1",
    # LangGraph / LangChain
    "langgraph>=0.4",
    "langchain-core>=0.3",
    # Document automation
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "PyMuPDF>=1.24",
    # Browser automation
    "playwright>=1.50",
    # Windows automation (Windows only)
    "pywin32>=308; sys_platform == 'win32'",
    "uiautomation>=2.0; sys_platform == 'win32'",
    # Image / vision
    "pillow>=11",
    "pyautogui>=0.9; sys_platform == 'win32'",
    # Utilities
    "psutil>=7",
    "rich>=14",
    "structlog>=25.0",
    "orjson>=3.11",
    # Token counting
    "tiktoken>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=0.26",
    "pytest-httpx>=0.35",
    "httpx>=0.28",
    "mypy>=1.15",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syncnode_backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"

[tool.ruff]
line-length = 100

[tool.pyright]
extraPaths = ["../ai_ml/src"]

